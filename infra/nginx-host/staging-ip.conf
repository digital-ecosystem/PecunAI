# Staging vhost reached by BARE IP — no DNS record required.
#
# Why this exists: the provider firewall (IONOS) permits only 22/80/443 inbound. Port 4002 is
# open on the VPS itself — ufw is inactive and the container binds 0.0.0.0 — but packets never
# arrive, so staging was unreachable. Moving it to another port does not help; every port outside
# those three is blocked. nginx already owns 80 and 443, so staging goes through nginx instead.
#
# Deployed to /etc/nginx/sites-available/staging-ip and symlinked into sites-enabled.
#
# ── Why this does not disturb production ─────────────────────────────────────────────────────
# `default_server` only decides who handles a request that matches NO server_name. Production's
# vhost declares `server_name onboarding.4money.at`, so any request carrying that Host (or that
# TLS SNI) still goes to production exactly as before. What changes is only the fallback: a
# request to the raw IP, which previously got production's 404, now reaches staging.
#
# Certbot renewals for onboarding.4money.at are unaffected: the HTTP-01 challenge arrives with
# `Host: onboarding.4money.at`, which matches production's named block, not this default.
#
# ── The self-signed certificate ──────────────────────────────────────────────────────────────
# A public CA cannot issue for a bare IP without ownership proof, so this uses a self-signed cert
# carrying `subjectAltName = IP:...`. Browsers show a one-time interstitial ("Your connection is
# not private" → Advanced → Proceed). That warning is expected here.
#
# It is worth clicking through rather than using plain HTTP, because once accepted the origin
# counts as a SECURE CONTEXT — and getUserMedia only works on a secure context. Over plain HTTP
# the app loads but the microphone is blocked, which makes the voice flow untestable. This is the
# only reason the HTTPS half of this file exists.
#
# ── Replacing this with the real thing ───────────────────────────────────────────────────────
# When a hostname becomes available, use infra/nginx-host/staging.conf.example instead: a real
# certificate, no browser warning, and no default_server. Remove this file's symlink at that
# point so the IP stops answering.

server {
    listen 80  default_server;
    listen 443 ssl default_server;

    # `_` never matches a real Host header — this block is reached only via default_server,
    # i.e. only by requests that match no other vhost.
    server_name _;

    ssl_certificate     /etc/nginx/ssl/staging-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/staging-selfsigned.key;

    # PDF uploads (legitimation documents, signed contracts) exceed the 1M default.
    client_max_body_size 25M;

    # One location proxying everything, including the WebSocket upgrade that
    # /api/realtime/proxy needs for the OpenAI voice connection. Do not add a narrower location
    # that bypasses the Upgrade/Connection headers, or voice breaks.
    location / {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
