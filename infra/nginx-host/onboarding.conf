# Host nginx vhost for onboarding.4money.at — S2S Finance (PecunAI).
#
# Deployed by .github/workflows/deploy.yml, which copies this to
# /etc/nginx/sites-available/onboarding, runs `nginx -t`, then reloads. A syntax error or a missing
# certificate aborts the release instead of taking the site down.
#
# Copied verbatim from the live VPS config — the only edits are these comments.
#
# CERTBOT: the "# managed by Certbot" lines below were written by `certbot --nginx`. Renewals only
# replace the certificate FILES, not this vhost, so version-controlling it is safe. But if certbot
# ever re-runs against nginx and edits the copy on the server, the next deploy overwrites that edit
# — so pull any certbot change back into this file rather than leaving it only on the box.
#
# The single `location /` block proxies everything to the app on 127.0.0.1:4001, including the
# WebSocket upgrade that /api/realtime/proxy needs (the OpenAI voice connection). Do not add a
# narrower location that bypasses those Upgrade/Connection headers, or voice breaks.

server {
    server_name onboarding.4money.at;

    location / {
        proxy_pass http://127.0.0.1:4001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    client_max_body_size 25M;
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/onboarding.4money.at/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/onboarding.4money.at/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = onboarding.4money.at) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name onboarding.4money.at;
    return 404; # managed by Certbot


}